name: Poimen typecheck

on:
  pull_request:
    branches: [poimen-main]
    paths:
      - 'poimen/**'
      - '.github/workflows/poimen-typecheck.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poimen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: poimen/package-lock.json
      - run: npm ci
      - run: npm run typecheck
